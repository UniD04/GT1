<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Piece</title>
<script src="/config.js"></script>
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/style.css">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"}}</script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js" integrity="sha384-g4NTh/Iv5PPU4xPyhEWqPcwtNXOvdaDI8LLnyYfyNZOjKJeYQyjzQ9X5275eBjpt" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js" integrity="sha384-Z3REaz79l2IaAZqJsSABtTbhjgOUYyV3p90XNnAPCSHg3EMTz1fouunq9WZRtj3d" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/CustomEase.min.js" integrity="sha384-BXj4dUwqsTW7BsafEOy150542LwVf57RoKjTk3Ay1dXyFXRwipZgJWd1QKIxStwq" crossorigin="anonymous"></script>
</head><body><main id="app"></main>
<script src="/app.js"></script>
<script type="module">
import { mountViewer, pieceSnapshot } from '/viewer.js';

// "Ø 26mm", "52mm", "2 1/2 in", "5cm", '13½"' -> inches (0 if it can't be read, which hides the ruler)
const FRAC = { '½': .5, '¼': .25, '¾': .75, '⅛': .125, '⅜': .375, '⅝': .625, '⅞': .875, '⅓': 1 / 3, '⅔': 2 / 3 };
function parseInches(s) {
  s = String(s || ''); const num = s.match(/\d+(?:\.\d+)?/); if (!num) return 0;
  let n = parseFloat(num[0]); const fr = s.match(/[½¼¾⅛⅜⅝⅞⅓⅔]/), sl = s.slice(num.index + num[0].length).match(/(\d+)\s*\/\s*(\d+)/);
  if (fr) n += FRAC[fr[0]]; else if (sl && +sl[2]) n += +sl[1] / +sl[2];
  return /mm/i.test(s) ? n / 25.4 : /cm/i.test(s) ? n / 2.54 : /["”]|in/i.test(s) ? n : n / 25.4;      // a bare number is read as millimetres
}
/** Ruler under the picture: inches along the bottom edge, millimetres along the top. Spans exactly the piece's width. */
function buildRuler(bar, inches) {
  const mmTotal = inches * 25.4, tick = (cls, left, h, edge) => { const t = document.createElement('i'); t.className = 'tk ' + cls; t.style.cssText = `left:${left}%;height:${h}px;${edge}:0`; bar.appendChild(t); };
  const label = (txt, left, edge) => { const s = document.createElement('span'); s.className = 'tl'; s.textContent = txt; s.style.cssText = `left:${left}%;${edge}:20px`; bar.appendChild(s); };
  const step = mmTotal > 150 ? 5 : mmTotal > 60 ? 2 : 1, lab = mmTotal > 150 ? 50 : mmTotal > 60 ? 10 : 5;
  for (let m = 0; m * step <= mmTotal; m++) {                                  // millimetres
    const mm = m * step, left = mm / mmTotal * 100, major = mm % lab === 0;
    tick('cm', left, major ? 20 : mm % (lab / 2) === 0 ? 13 : 7, 'top'); if (major) label(String(mm), left, 'top');
  }
  const istep = inches > 3 ? .25 : .125;
  for (let q = 0; q * istep <= inches + 1e-9; q++) {                           // inches
    const v = q * istep, left = v / inches * 100, whole = Math.abs(v - Math.round(v)) < 1e-9, half = Math.abs(v * 2 - Math.round(v * 2)) < 1e-9;
    tick('in', left, whole ? 22 : half ? 15 : 9, 'bottom'); if (whole) label(String(Math.round(v)), left, 'bottom'); else if (half && inches < 3) label('½', left, 'bottom');
  }
}
loadData().then(d => {
  const w = d.pieces.find(x => x.id === new URLSearchParams(location.search).get('id'));
  chrome(d, 'pieces');
  document.title = (w ? w.name : 'Not found') + ' · ' + d.site.name;
  // "Contact us" opens the visitor's email app, pre-filled with this piece (address is editable in the admin panel)
  const mail = w && safeMail(d.site.contactEmail);
  const contact = mail ? `mailto:${mail}?subject=${encodeURIComponent('Enquiry: ' + w.name)}&body=${encodeURIComponent(`Hello,\n\nI would like to know more about the ${w.name} (${w.metal}, ${w.gemstone}, ${w.size}).\n`)}` : '';
  document.getElementById('app').innerHTML = !w ? `<section class="page-top head"><h2>${esc(L('notFound', 'Piece not found'))}</h2><a class="btn" href="/pieces.html">${esc(L('collectionTitle', 'All pieces'))}</a></section>` : `
  <div class="detail"><div><div class="viewer" id="viewer"></div><p class="hint">${esc(L('dragHint', 'Drag to rotate'))}</p></div><div id="info">
    <a class="back" href="/pieces.html">${esc(L('backToAll', '← All pieces'))}</a>
    <div class="eyebrow">${esc(L('pieceEyebrow', 'The piece'))}</div><h1>${esc(w.name)}</h1><p style="color:var(--mute)">${esc(w.description)}</p>
    <div class="spec"><b>${esc(L('metal', 'Metal'))}</b><span>${esc(w.metal)}</span><b>${esc(L('gemstone', 'Gemstone'))}</b><span>${esc(w.gemstone)}</span><b>${esc(L('size', 'Size'))}</b><span>${esc(w.size)}</span></div>
    ${w.price ? `<div class="price"><small>${esc(L('price', 'Price'))}</small>${esc(w.price)}</div>` : ''}
    <div class="actions"><a class="btn solid" id="shopBtn" href="/shop.html">${esc(L('visitShop', 'Visit the shop'))}</a>${contact ? `<a class="btn" id="contactBtn" href="${esc(contact)}">${esc(L('contactUs', 'Contact us'))}</a>` : ''}${heartBtn('piece:' + w.id)}</div></div></div>
  <section class="showcase"><div class="eyebrow">${esc(L('actualSize', 'Actual size'))}</div>
    <div class="rulerbox"><img id="pieceimg" alt="${esc(w.name)}, front view"><div class="ruler" id="ruler"><b class="u u-cm">mm</b><b class="u u-in">in</b></div></div>
    <p class="hint">${esc(L('trueProportions', 'True proportions'))} · ${esc(w.size)}</p></section>`;
  if (!w) return;
  // insights: which piece was viewed, and who clicked Contact us / Visit the shop from it
  track('view', 'piece:' + w.id);
  document.getElementById('contactBtn')?.addEventListener('click', () => track('contact', 'piece:' + w.id));
  document.getElementById('shopBtn').addEventListener('click', () => track('shop', 'piece:' + w.id));
  mountViewer(document.getElementById('viewer'), w, { controls: true, tilt: .25 });
  const inches = parseInches(w.size), img = document.getElementById('pieceimg');
  if (inches > 0) buildRuler(document.getElementById('ruler'), inches); else document.getElementById('ruler').remove();
  pieceSnapshot(w).then(({ url, ratio }) => {
    img.src = url; if (ratio) document.querySelector('.rulerbox').style.maxWidth = Math.min(1000, Math.round(620 / Math.max(ratio, .62))) + 'px';
    gsap.from('.rulerbox', { opacity: 0, y: 30, duration: 1, ease: 'power3.out', scrollTrigger: { trigger: '.rulerbox', start: 'top 90%', once: true } });
  }).catch(e => { console.warn('Snapshot failed', e); img.replaceWith(Object.assign(document.createElement('div'), { innerHTML: art(w) }).firstChild); });
  gsap.from('#info > *', { x: 40, opacity: 0, duration: .8, delay: .2, stagger: .1, ease: 'power3.out' });
});
</script></body></html>
