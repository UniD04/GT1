<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reels</title>
<script src="/config.js"></script>
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/reels.css">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"}}</script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js" integrity="sha384-g4NTh/Iv5PPU4xPyhEWqPcwtNXOvdaDI8LLnyYfyNZOjKJeYQyjzQ9X5275eBjpt" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js" integrity="sha384-Z3REaz79l2IaAZqJsSABtTbhjgOUYyV3p90XNnAPCSHg3EMTz1fouunq9WZRtj3d" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/CustomEase.min.js" integrity="sha384-BXj4dUwqsTW7BsafEOy150542LwVf57RoKjTk3Ay1dXyFXRwipZgJWd1QKIxStwq" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/animejs@3.2.2/lib/anime.min.js"></script>
</head><body>
<div class="embers" id="embers" aria-hidden="true"></div>
<main id="app"></main>
<script src="/app.js"></script>
<script type="module">
import { reelHTML, initReels, embers } from '/reels.js';
loadData().then(d => {
  chrome(d, 'reels'); document.title = L('reelsName', 'The Midnight Reel') + ' · ' + d.site.name;
  document.getElementById('app').innerHTML = `<section class="page-top reels-top"><div class="head"><div class="eyebrow">${esc(L('reelsName', 'The Midnight Reel'))}</div><h2>${esc(L('reelsTitle', 'Jewels in motion'))}</h2>
    <p>${esc(L('reelsIntro', ''))}</p></div>
    <div class="scroll-cue" aria-hidden="true"><span>${esc(L('scrollCue', 'Scroll'))}</span><i></i></div></section>
    <div class="reel-feed" id="feed"><div class="reel-spine" aria-hidden="true"><i class="flame"></i></div>${d.pieces.map((p, i) => reelHTML(p, i)).join('')}</div>
    <section class="reel-end"><div class="head"><div class="eyebrow">${esc(L('reelsEndEyebrow', ''))}</div><h2>${esc(L('reelsEndTitle', ''))}</h2>
      <p><a class="btn solid" href="/pieces.html">${esc(L('browseAll', 'Browse all pieces'))}</a> <a class="btn" href="/#social">${esc(L('reelsFollow', 'Follow us'))}</a></p></div></section>`;
  const feed = document.getElementById('feed');
  initReels(feed, d.pieces);
  embers(document.getElementById('embers'));
  // the flame on the spine rides the scroll position
  const flame = feed.querySelector('.flame'), move = () => { const r = feed.getBoundingClientRect(), t = Math.min(1, Math.max(0, (innerHeight * .5 - r.top) / r.height)); flame.style.top = (t * 100) + '%'; };
  addEventListener('scroll', move, { passive: true }); move();
});
</script></body></html>
